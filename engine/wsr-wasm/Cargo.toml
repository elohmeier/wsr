[package]
name = "wsr-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Browser binding for wsr-core (plain C-ABI exports, used from a Web Worker)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1.0.154"
wsr-core = { path = "../wsr-core" }

[features]
original-tests = ["wsr-core/original-tests"]

[[test]]
name = "campaign"
path = "tests/campaign.rs"
required-features = ["original-tests"]
